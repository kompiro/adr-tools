name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing; also signs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # NOTE: deliberately NO `registry-url` / `scope` here. setup-node's
      # registry-url writes an .npmrc with `//registry.npmjs.org/:_authToken=
      # ${NODE_AUTH_TOKEN}` and defaults NODE_AUTH_TOKEN to a dummy placeholder.
      # pnpm then sees that (invalid) token and skips the OIDC token exchange,
      # so npm rejects the publish with a masked 404. For Trusted Publishing the
      # .npmrc must carry NO authToken. The registry is already pinned via
      # `publishConfig.registry` in package.json.
      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node >= 22.14.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      # Tokenless publish via GitHub OIDC (npm Trusted Publishing). pnpm exchanges
      # the OIDC token for a short-lived npm token; provenance is attached.
      - run: pnpm publish --no-git-checks --access public --provenance
